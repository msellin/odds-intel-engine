# CROSSRANK-REFRESH-OOM-PRESSURES-OUR-BOX (OddsIntel, 2026-09-21)
#
# Installed at: /etc/systemd/system/crossrank-refresh.service.d/10-memory-cap.conf
#
# WHY. crossrank-refresh.service ran with MemoryHigh=infinity / MemoryMax=infinity
# on the 15 GB Hetzner box it SHARES with the OddsIntel scheduler, Postgres and
# FlareSolverr. Over 14 days it produced OOM kills whose victims were mostly NOT
# itself: chromium (FlareSolverr — i.e. the live odds feed) and unrelated python.
# An unbounded daily job on a shared box is a lottery for every other service.
#
# MEASURED BEFORE CHOOSING THESE NUMBERS (do not "tidy" them without re-measuring):
#   normal successful peak    6.42 GB   (systemd MemoryPeak=6893457408)
#   runaway peaks seen at OOM 6.3 / 6.6 / 8.1 GB anon-rss
#
# MemoryHigh=7G  throttles only ABOVE the normal peak, so ordinary refreshes are
#                untouched and only a runaway feels back-pressure.
# MemoryMax=9G   hard stop. A runaway now fails THIS service instead of killing the
#                odds feed. That is the intended trade: CrossRank's refresh is
#                retryable and runs daily; a dead FlareSolverr session is a
#                permanent gap in our price history.
#
# If CrossRank's own workload legitimately grows past 7 GB, raise these — but
# re-measure MemoryPeak first, and remember the ceiling is shared.
[Service]
MemoryHigh=7G
MemoryMax=9G
