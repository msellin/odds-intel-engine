name: OddsIntel — Run DB Migrations

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/migrate.yml'
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Apply pending migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
          # --include-all (MIGRATE-OUT-OF-ORDER-FIX, 2026-06-02): the Supabase
          # CLI refuses to apply migrations whose version-prefix is earlier
          # than the latest already-applied migration. This bit us when
          # parallel work in WC-V2-T1 took prefix 165 + 166 while a sibling
          # work item had taken 165 and got renamed to 167; the workflow then
          # errored with "Found local migration files to be inserted before
          # the last migration on remote database."  Our migrations are
          # additive + idempotent (CREATE TABLE IF NOT EXISTS, DROP POLICY
          # IF EXISTS, etc.), so applying out-of-order is safe in our shape.
          # The path trigger above also watches this workflow file so edits
          # here re-run on the next push.
          supabase db push --include-all
