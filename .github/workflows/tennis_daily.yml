name: OddsIntel — Tennis Daily Cycle

# TENNIS PAUSED 2026-07-02 — focus on CS2 + soccer. Cron disabled;
# workflow_dispatch stays available for manual runs when tennis restarts.
# When re-enabling, uncomment the schedule block below AND uncomment the
# tennis scheduler.add_job() registrations in workers/scheduler.py (git
# history has the previous registrations).

on:
  # schedule:
  #   - cron: '5 6 * * *'    # 06:05 UTC daily
  #   - cron: '5 14 * * *'   # 14:05 UTC daily
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tennis-daily
  cancel-in-progress: false

jobs:
  tennis-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install deps
        run: pip install --quiet psycopg2-binary python-dotenv rich requests

      - name: Run tennis daily cycle
        env:
          # The Odds API — scanner, settlement, closing-odds
          OA_KEY:                  ${{ secrets.OA_KEY }}
          ODDS_API_KEY:            ${{ secrets.ODDS_API_KEY }}
          # Coolbet public-read path — env cookie + no-FS mode
          # (FlareSolverr only runs on the Mac daemon; GH Actions
          # uses the static cookie directly).
          COOLBET_COOKIE_REESE84:  ${{ secrets.COOLBET_COOKIE_REESE84 }}
          COOLBET_NO_FS:           "true"
          # DB credentials — same as Railway's scheduler service.
          SUPABASE_DB_URL:         ${{ secrets.SUPABASE_DB_URL }}
          DATABASE_URL:            ${{ secrets.DATABASE_URL }}
          SUPABASE_URL:            ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          # If the Coolbet cookie isn't set, skip that step so the rest of
          # the cycle still ships — partial-day coverage beats nothing.
          if [ -z "$COOLBET_COOKIE_REESE84" ]; then
            python3 scripts/tennis/run_all.py --skip-coolbet
          else
            python3 scripts/tennis/run_all.py
          fi

      - name: Health check
        if: always()
        env:
          OA_KEY:                  ${{ secrets.OA_KEY }}
          ODDS_API_KEY:            ${{ secrets.ODDS_API_KEY }}
          SUPABASE_DB_URL:         ${{ secrets.SUPABASE_DB_URL }}
          DATABASE_URL:            ${{ secrets.DATABASE_URL }}
        run: |
          # Run regardless of cycle outcome so failure modes are visible.
          python3 scripts/tennis/health_check.py || true
