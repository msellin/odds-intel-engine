name: Smoke Tests

# CI-SMOKE-GATE-DEAD-2026-08-24 / fixed 2026-08-26.
#
# This gate had not passed in weeks, and the diagnosis on file was that the
# `DATABASE_URL` repo secret was stale — pointing at localhost:5433, "the
# SSH-tunnel address from the pre-SUPABASE-TO-VPS setup", with the fix being for
# the operator to rotate it.
#
# That was wrong, and it is worth saying why: localhost:5433 IS correct. It is
# the tunnel address, and `migrate.yml` uses the very same secret successfully
# on every migration push. The difference is that migrate.yml OPENS the tunnel
# first, and this workflow never did. So every DB-backed test here failed with
# `Connection refused` — 89 of them at the time, which meant a genuine
# regression was indistinguishable from the standing failure.
#
# No secret rotation is needed. VPS_DEPLOY_KEY already exists (migrate.yml has
# been using it since the VPS cutover); this workflow just has to open the same
# tunnel before running the suite.
#
# Why this matters beyond tidiness: CLAUDE.md tells agents not to run the full
# suite locally because "GitHub Actions runs it on every push to main — that's
# the gate". A permanently-red gate is worse than no gate, because it looks like
# one. On 2026-08-26 it hid two regressions that were only caught by diffing
# failing test NAMES against a baseline commit.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # CI-SMOKE-CROSS-REPO-BLIND-2026-09-06 — the second way this gate died.
      #
      # Five tests read the FRONTEND source through `../../odds-intel-web/...`
      # (EXEC-ODDS-SINGLE-SOURCE, LANDING-PERF-ROI-BASIS,
      # LANDING-PERF-COHORT-SHARED, PICKS-MIN-ODDS-WRONG-FORMULA,
      # SHADOW-PAGE-ROI-INFLATED). That repo was never checked out here, so all
      # five failed with FileNotFoundError on every run.
      #
      # Worse than merely failing: EXEC-ODDS-SINGLE-SOURCE asserts the
      # executable-price rule "is implemented exactly once" and reported
      # "implemented 0 times" — a test written specifically to stop the
      # four-surfaces-one-number bug, reduced to noise. Those tests exist
      # because the same rule was fixed four times in one day on 2026-09-05,
      # and they could not have caught a fifth. A fifth is exactly what turned
      # up on 2026-09-06 in the signed public ledger.
      #
      # The sibling layout is what the tests assume, so reproduce it: check the
      # web repo out inside the workspace, then symlink it to the sibling path.
      # `path:` cannot escape the workspace, hence the symlink rather than
      # `path: ../odds-intel-web`.
      - name: Check out odds-intel-web (frontend, for cross-repo assertions)
        uses: actions/checkout@v4
        with:
          repository: msellin/odds-intel-web
          path: _web
      - name: Place it at the sibling path the tests expect
        run: |
          ln -sfn "$GITHUB_WORKSPACE/_web" "$(dirname "$GITHUB_WORKSPACE")/odds-intel-web"
          test -f "$(dirname "$GITHUB_WORKSPACE")/odds-intel-web/src/lib/engine-data.ts" \
            || { echo "::error::frontend checkout is not where the tests look"; exit 1; }

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Same tunnel migrate.yml opens. Kept byte-identical on purpose: if the
      # VPS address or key handling ever changes, both workflows should be
      # edited together and a diff between them makes that obvious.
      - name: Open SSH tunnel to VPS Postgres
        env:
          VPS_DEPLOY_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$VPS_DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 204.168.199.8 >> ~/.ssh/known_hosts 2>/dev/null
          ssh -f -N -o ExitOnForwardFailure=yes -o ServerAliveInterval=30 \
              -L 5433:localhost:5432 root@204.168.199.8
          nc -z localhost 5433 && echo "tunnel up on localhost:5433"

      - name: Run smoke tests
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/smoke_test.py
