name: OddsIntel — Daily Competitor Audits

# COMPETITOR-AUDIT-DAILY (2026-07-19): 02:00 UTC daily. Was weekly Sunday
# 02:00 UTC until 2026-07-19; bumped to daily so the landing page's
# matched-window ROI card doesn't sit 6 days stale mid-week.
# Re-runs every audit_vs_*.py to refresh ledger/comparison_*.json. The
# web landing fetches these JSONs via raw.githubusercontent with 6h
# revalidate, so daily cron × 6h edge cache → landing staleness floor
# drops from ~6 days to ~6 hours.
#
# Does NOT re-scrape competitor data — that's a heavier monthly job
# (separate workflow). This cron just re-runs the audit math on:
#   - WinnerOdds  → fresh GraphQL pull each run (~5min)
#   - SignalOdds / DeepBetting / Forebet / Tipstrr → existing dev/active
#     JSON snapshots (re-runs the math but not the scrape). Their ROI
#     changes day-to-day only because OUR matched cohort grows daily.
#   - Betaminic   → auth-walled, stays at status:"auth_required"
#
# Our cohort numbers DO update each run because OddsIntel keeps placing
# new bets — every day the matched-window n/ROI bump up.

on:
  schedule:
    - cron: '0 2 * * *'   # 02:00 UTC daily (was '0 2 * * 0' Sunday, 2026-07-19 → daily)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: competitor-audits-daily
  cancel-in-progress: false

jobs:
  audits:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install deps
        run: pip install --quiet psycopg2-binary python-dotenv rich requests

      # COMPETITOR-AUDIT-DB-TUNNEL (2026-07-31): SUPABASE-TO-VPS-2026-07-13
      # dropped the `public` schema on Supabase (128 tables), so the audit
      # scripts' `simulated_bets` reads started returning UndefinedTable.
      # `continue-on-error: true` on each audit step hid the failure — every
      # daily run committed nothing since 2026-07-12. Fix: open an SSH tunnel
      # to VPS Postgres before the audits so `DATABASE_URL=...@localhost:5433/oddsintel`
      # resolves to the live DB. VPS_DEPLOY_KEY has the private half.
      - name: Open SSH tunnel to VPS Postgres
        env:
          VPS_DEPLOY_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$VPS_DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 204.168.199.8 >> ~/.ssh/known_hosts 2>/dev/null
          ssh -f -N -o ExitOnForwardFailure=yes -o ServerAliveInterval=30 \
              -L 5433:localhost:5432 root@204.168.199.8
          # Prove the tunnel came up
          nc -z localhost 5433 && echo "tunnel up on localhost:5433"

      - name: Audit vs WinnerOdds
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        continue-on-error: true
        run: python3 scripts/audit_vs_winnerodds.py

      - name: Audit vs SignalOdds
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        continue-on-error: true
        run: python3 scripts/audit_vs_signalodds.py

      - name: Audit vs DeepBetting
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        continue-on-error: true
        run: python3 scripts/audit_vs_deepbetting.py

      - name: Audit vs Forebet
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        continue-on-error: true
        run: python3 scripts/audit_vs_forebet.py

      - name: Audit vs Tipstrr
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        continue-on-error: true
        run: python3 scripts/audit_vs_tipstrr.py

      # COMPETITOR-PICKS-CSV (2026-08-01): the audits above emit per-source
      # picks_<src>.csv alongside comparison_*.json. Dump OddsIntel's own
      # picks + build the fixture-level matrix so the landing "Verify" link
      # points at real per-pick data, not just aggregates.
      - name: Dump OddsIntel picks CSV
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        continue-on-error: true
        run: python3 scripts/dump_oddsintel_picks_csv.py

      - name: Build matched picks matrix
        continue-on-error: true
        run: pip install --quiet rapidfuzz && python3 scripts/build_matched_picks_csv.py

      - name: Commit + push if changed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ledger/comparison_*.json ledger/picks_*.csv
          if git diff --cached --quiet; then
            echo "No comparison-JSON changes — exiting cleanly."
            exit 0
          fi
          DATE=$(date -u +%Y-%m-%d)
          git commit -m "competitor-audits: weekly refresh ${DATE}

          Auto-refreshed ledger/comparison_*.json via the
          scripts/audit_vs_*.py pipeline. The web landing reads these
          JSONs at runtime with 6h revalidate."
          git push origin HEAD:main

      # COMP-FALLBACK-AUTOREFRESH (2026-07-06): the odds-intel-web landing
      # embeds a COMP_FALLBACK dict used when the runtime GitHub-raw fetch
      # fails. Without this step it would freeze at the values shipped in
      # the initial commit — silently diverging from reality for months.
      # Requires FRONTEND_REPO_TOKEN (fine-grained PAT with contents:write
      # on msellin/odds-intel-web). If the secret is empty every step here
      # no-ops cleanly — audit run stays green either way.
      #
      # GitHub Actions doesn't let step-level `if:` read secrets.* directly,
      # so we project the secret into a job env var (empty if unset) and
      # gate on that. `continue-on-error: true` on each step is belt-and-
      # -braces protection against transient push/checkout failures.
      - name: Check FRONTEND_REPO_TOKEN presence
        id: pat_check
        env:
          FRONTEND_REPO_TOKEN: ${{ secrets.FRONTEND_REPO_TOKEN }}
        run: |
          if [ -n "$FRONTEND_REPO_TOKEN" ]; then
            echo "has_pat=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_pat=false" >> "$GITHUB_OUTPUT"
            echo "FRONTEND_REPO_TOKEN not set — will skip fallback refresh."
          fi

      - name: Checkout odds-intel-web
        if: steps.pat_check.outputs.has_pat == 'true'
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: msellin/odds-intel-web
          token: ${{ secrets.FRONTEND_REPO_TOKEN }}
          path: odds-intel-web
          fetch-depth: 1

      - name: Refresh COMP_FALLBACK in odds-intel-web
        if: steps.pat_check.outputs.has_pat == 'true'
        continue-on-error: true
        run: |
          if [ ! -d odds-intel-web ]; then
            echo "odds-intel-web not checked out — skipping fallback refresh."
            exit 0
          fi
          python3 scripts/update_frontend_comp_fallback.py \
            --web-repo "$GITHUB_WORKSPACE/odds-intel-web"

      - name: Commit + push COMP_FALLBACK refresh
        if: steps.pat_check.outputs.has_pat == 'true'
        continue-on-error: true
        working-directory: odds-intel-web
        run: |
          if [ ! -f src/app/page.tsx ]; then
            echo "page.tsx missing in web checkout — skipping."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/page.tsx
          if git diff --cached --quiet; then
            echo "COMP_FALLBACK already current — nothing to commit."
            exit 0
          fi
          DATE=$(date -u +%Y-%m-%d)
          git commit -m "landing: refresh COMP_FALLBACK ${DATE}

          Auto-refreshed from odds-intel-engine ledger/comparison_*.json
          via competitor_audits_weekly.yml. Keeps the hardcoded landing
          fallback within one week of reality so a runtime GitHub-raw
          outage degrades to recent numbers, not months-old ones."
          git push origin HEAD:main
