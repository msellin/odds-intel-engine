# RAILWAY-ELIMINATION (2026-06-29): FlareSolverr for the Hetzner VPS.
#
# This replaces the Railway-hosted FlareSolver service used for HLTV/CS2
# scraping. The scheduler's FLARESOLVERR_URL systemd Environment= override
# points to http://localhost:8191 — this container satisfies that.
#
# Key difference from local/flaresolverr/docker-compose.yml (Mac):
#   NO persistent profile volume — HLTV sessions are torn down every 6h by
#   the FS auto-recover cron (FS-AUTO-RECOVER-HLTV). Persistence here would
#   just accumulate stale Chrome state with no benefit.
#
# Run:
#   cd local/systemd && docker compose up -d
# Verify:
#   curl http://localhost:8191/
# Stop:
#   docker compose down
#
# After a Docker image update:
#   docker compose pull && docker compose up -d

services:
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: oi_hetzner_flaresolverr
    # HOST NETWORKING, deliberately — and the bind is handled by HOST= below.
    #
    # WHY NOT A BRIDGE. On a bridge network the container could not reach the
    # WireGuard residential egress at 10.8.0.2:1080: measured 2026-09-22, the host
    # reaches it and a container on systemd_default (172.19.x) does not, so every
    # proxied Coolbet fetch died at the 60 s browser timeout and surfaced as
    # "HTTP 500 / cannot allocate a Chrome context" — a completely misleading
    # symptom that cost two wrong diagnoses (a wedged session, then a memory cap).
    #
    # ⚠️ HOST NETWORKING MAKES `ports:` INERT. The ONLY thing keeping FlareSolverr
    # off the public internet is now HOST=127.0.0.1 below. Removing or changing it
    # republishes a REMOTE BROWSER on a public IP that accepts a `proxy` field —
    # i.e. anyone could browse from the operator's home line. That is not
    # hypothetical: it was the live state of this box from 2026-06-29 until
    # 2026-09-22. Verify after any change:
    #     curl -m5 http://204.168.199.8:8191/   # MUST time out
    network_mode: host
    environment:
      BROWSER_TIMEOUT: "60000"
      LOG_LEVEL: "info"
      LOG_HTML: "false"
      CAPTCHA_SOLVER: "none"
      TZ: "UTC"
      # Loopback bind — see the network_mode note above. This is the security control.
      HOST: "127.0.0.1"
      PORT: "8191"
    restart: unless-stopped
    # Memory cap raised 1536m -> 3g on 2026-09-22. Measured: the container sits
    # at ~476 MiB IDLE with zero sessions, and one Coolbet session took it to
    # 705 MiB — so the old 1 GiB it was actually running under left roughly
    # 550 MiB for work and the Coolbet board sweep 500'd three times on
    # "cannot allocate a Chrome context". The box has ~7 GB free; 1 GiB was a
    # laptop-shaped number inherited from the Mac compose, not a VPS one.
    # (The old comment here said "the 4 GB VPS" — the box is 15.6 GB.)
    mem_limit: 3g
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8191/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
