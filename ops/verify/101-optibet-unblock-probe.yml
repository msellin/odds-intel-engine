# [[#101]] Optibet answered both VPS egresses with its 403 block page on 2026-09-26 (probably from too many
# requests during the 09-24 probing + the 09-26 build). Owner 2026-09-26: "wait, try again in an hour, then
# again in 2 hours, and if that doesn't work, in 4 hours". ONE request per probe (GET /groups through the
# feed's own metered session, so it counts in the Optibet footprint budget) at ~16:10, ~18:10 and ~22:10 UTC.
# Each probe runs once: `expires` is 25 min after its start, and the queue runs at :10/:40.
# 200 = unblocked → schedule the feed (#101). 403 = still blocked → Telegram tells the operator.
task: "#101"
checks:
  - name: optibet_probe_1h
    mode: now
    cmd: ["./venv/bin/python", "-c", "from workers.automation import optibet_feed as o; r = o._session().get(o._BASE + '/groups', params=[o._DOMAIN], timeout=30); print(r.status_code)"]
    expect: "== 200"
    run_after:
      time: 2026-09-26T16:05:00Z
    expires: "2026-09-26T16:30:00Z"
  - name: optibet_probe_3h
    mode: now
    cmd: ["./venv/bin/python", "-c", "from workers.automation import optibet_feed as o; r = o._session().get(o._BASE + '/groups', params=[o._DOMAIN], timeout=30); print(r.status_code)"]
    expect: "== 200"
    run_after:
      time: 2026-09-26T18:05:00Z
    expires: "2026-09-26T18:30:00Z"
  - name: optibet_probe_7h
    mode: now
    cmd: ["./venv/bin/python", "-c", "from workers.automation import optibet_feed as o; r = o._session().get(o._BASE + '/groups', params=[o._DOMAIN], timeout=30); print(r.status_code)"]
    expect: "== 200"
    run_after:
      time: 2026-09-26T22:05:00Z
    expires: "2026-09-26T22:30:00Z"
